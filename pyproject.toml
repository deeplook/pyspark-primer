[project]
name = "pyspark-primer"
version = "0.1.0"
description = "Small, self-contained PySpark scripts for learning the DataFrame API"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dinu Gherman" },
]
keywords = ["pyspark", "spark", "dataframe", "tutorial", "learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Education",
]
requires-python = ">=3.12"
dependencies = [
    "pyspark>=4.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/deeplook/pyspark-primer"

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
disable_error_code = ["untyped-decorator"]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=9.0.3",
]
# Sail (https://github.com/lakehq/sail) is a Rust-native, Spark Connect
# compatible engine. Installing it pulls in the Spark Connect client extras
# (grpc, pyarrow, ...) needed to talk to a Sail server from PySpark.
sail = [
    "pysail>=0.6.6",
    "pyspark[connect]>=4.1.1",
]
